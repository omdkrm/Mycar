name: Android Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.MYCAR_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MYCAR_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No keystore secret found: the APK will be built unsigned."
          fi

      - name: Run unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        working-directory: android
        env:
          MYCAR_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MYCAR_RELEASE_KEYSTORE_PASSWORD }}
          MYCAR_RELEASE_KEY_ALIAS: ${{ secrets.MYCAR_RELEASE_KEY_ALIAS }}
          MYCAR_RELEASE_KEY_PASSWORD: ${{ secrets.MYCAR_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: test -n "$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCar-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
